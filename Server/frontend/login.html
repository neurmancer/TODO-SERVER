<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sign in · Cyberspace</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/style.css">
    <script src="/intro.js"></script>
    <script src="/login.js" defer></script>
</head>
<body class="login-page">
    <button class="site-intro" type="button" aria-label="Skip opening animation" hidden>
        <span class="intro-word" data-text="Cyberspace" aria-hidden="true">Cyberspace</span>
        <span class="intro-streaks" aria-hidden="true"></span>
    </button>
    <main class="login-shell">
        <header class="page-header">
            <p class="eyebrow">// a little order in the chaos</p>
            <h1>Cyberspace<span class="login-cursor" aria-hidden="true">™</span></h1>
        </header>
        <section class="card login-card" aria-labelledby="login-heading">
            <div class="login-card-top"><span class="login-light" aria-hidden="true"></span><span>// welcome back</span><span aria-hidden="true">[ &gt;_ ]</span></div>
            <h2 id="login-heading">Got some cool shit to build?</h2>
            <p class="login-intro">Hop in. Embrace the Order in Chaos.</p>
            <form id="login-form" action="/login" method="POST">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username" maxlength="64" placeholder="Your username" required autofocus>
                <label for="password">Password</label>
                <div class="password-control">
                    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required>
                    <button id="toggle-password" type="button" aria-label="Show password" aria-controls="password" aria-pressed="false" hidden>Show</button>
                </div>
                <p id="login-status" class="login-status" role="status" aria-live="polite"></p>
                <button id="sign-in" class="login-submit" type="submit">Enter cyberspace <span aria-hidden="true">→</span></button>
            </form>
            <noscript><p>Enable JavaScript to sign in here.</p></noscript>
            <p class="login-footnote">Wake the fuck up samurai we got shit to implement.</p>
        </section>
        <footer class="footer"><p>A Shitty Enterprise™ Product</p><p class="she-loves-purple">Mwah OwO</p></footer>
    </main>
</body>
</html>
