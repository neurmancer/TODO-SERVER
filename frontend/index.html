<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberspace</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/style.css">
    <script src="/jukebox.js" defer></script>
</head>
<body>
    <header class="page-header">
        <p class="eyebrow">// a little order in the chaos</p>
        <h1 class="glow">Cyberspace</h1>
        <p>Think cool shit. <span class="she-loves-purple">Then Implement.</span></p>
    </header>
    <main>
        <section class="card" aria-labelledby="create-heading">
            <h2 id="create-heading">// create a new todo</h2>
            <form class="create-form" action="/" method="POST">
                <label for="todo">What's Today's Fuckery?</label>
                <div class="create-controls">
                    <input id="todo" type="text" name="todo" placeholder="Drop your next idea here..." required>
                    <button type="submit">Concoct<span aria-hidden="true"></span></button>
                </div>
            </form>
        </section>
        <section class="todos-section" aria-labelledby="todos-heading">
            <h2 id="todos-heading">// your todos</h2>
            <ul class="todo-list">{{ todo_list }}</ul>
        </section>
    </main>
    <footer class="footer">My beloved cc sending her regards from the back-end<span class="she-loves-purple"></span>
        <p class=".she-loves-purple">Mwah   OwO</p>
    </footer>
    <div class="music-player" id="music-player" hidden></div>
    <p class="music-status" id="music-status" role="status"></p>
    <button type="button" class="music-btn" id="musicBtn" title="Play music" aria-label="Play music" aria-pressed="false">▶</button>
</body>
</html>
